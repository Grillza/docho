name: 🐞 Issue report
description: Report an issue in Dōchō
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where does the issue happen? Choose more than one if it happens on each.
      multiple: true
      options:
        - Android
        - iOS (iPhone)
        - iPadOS (iPad)
        - Dōchō Server (web UI or sync)
    validations:
      required: true

  - type: textarea
    id: reproduce-steps
    attributes:
      label: Steps to reproduce
      description: Provide an example of the issue.
      placeholder: |
        Example:
          1. First step
          2. Second step
          3. Issue here
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Explain what you should expect to happen.
      placeholder: |
        Example:
          "This should happen..."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Explain what actually happens.
      placeholder: |
        Example:
          "This happened instead..."
    validations:
      required: true

  - type: textarea
    id: crash-logs
    attributes:
      label: Crash logs
      description: |
        If you're experiencing crashes, share the crash logs here if you can.
        - **Android:** go to **More → Settings → Advanced**, press **Dump crash logs** and attach the file.
        - **iOS and iPadOS:** open the Settings app → **Privacy & Security → Analytics & Improvements → Analytics Data**, find the most recent entry starting with **Docho**, and share it.
        - **Dōchō Server:** attach the server's log from around the time of the issue.
      placeholder: |
        You can upload the crash log file as an attachment, or paste the crash logs in plain text if needed.

  - type: input
    id: app-version
    attributes:
      label: Dōchō version
      description: |
        In the app, it's under **More → About and help**. For Dōchō Server, it's on the web UI's **Settings → About** page.
      placeholder: |
        Example: "0.32.11"
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating system version
      description: Your Android, iOS or iPadOS version. For Dōchō Server, the system it runs on and whether it's in Docker.
      placeholder: |
        Example: "Android 15", "iOS 26.1" or "Docker on Debian 13"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: List your device and model. For Dōchō Server, the device you're opening it from, if it matters.
      placeholder: |
        Example: "Google Pixel 9" or "iPhone 16 Pro"
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      placeholder: |
        Additional details and attachments.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Read this carefully, we will close and ignore your issue if you skimmed through this.
      options:
        - label: I have searched the existing issues and this is a new ticket, **NOT** a duplicate or related to another open or closed issue.
          required: true
        - label: I have written a short but informative title.
          required: true
        - label: I have updated the app to the latest version (**0.32.11**).
          required: true
        - label: I have filled out all of the requested information in this form, including specific version numbers.
          required: true
        - label: I understand that **Dōchō does not have or fix any extensions**, and I **will not receive help** for any issues related to sources or extensions.
          required: true
