# XcodeGen spec. Generate the project with `xcodegen` in this directory;
# Docho.xcodeproj and Info.plist are generated and git-ignored.
name: Docho

options:
  bundleIdPrefix: io.github.grillza.docho
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  Nuke:
    url: https://github.com/kean/Nuke
    from: "12.0.0"

targets:
  Docho:
    type: application
    platform: iOS
    sources:
      - path: Docho
    dependencies:
      - package: GRDB
      - package: Nuke
      - package: Nuke
        product: NukeUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.grillza.docho
        PRODUCT_NAME: Docho
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: Docho/Resources/Info.plist
      properties:
        CFBundleDisplayName: Dōchō
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Kavita often runs on plain http on the LAN. NSAllowsLocalNetworking covers local IPs
        # and .local names; NSAllowsArbitraryLoads is also on because this is a personal,
        # sideloaded app and the server address is whatever the user types in.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Dōchō connects to your Kavita server on your local network.
        # "fetch" enables BGAppRefreshTask for opportunistic delivery of queued reading progress.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - io.github.grillza.docho.progress-sync
    scheme:
      testTargets:
        - DochoTests
        - DochoUITests
      gatherCoverageData: false

  DochoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DochoTests
    dependencies:
      # GRDB and Nuke come in through the host app; linking them here too would duplicate them.
      - target: Docho
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.grillza.docho.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  DochoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DochoUITests
    dependencies:
      - target: Docho
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.grillza.docho.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: Docho
