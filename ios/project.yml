# XcodeGen spec. Generate the project with `xcodegen` in this directory;
# Docho.xcodeproj and Info.plist are generated and git-ignored.
name: Docho

options:
  bundleIdPrefix: io.github.grillza.docho
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  Nuke:
    url: https://github.com/kean/Nuke
    from: "12.0.0"

targets:
  Docho:
    type: application
    platform: iOS
    sources:
      - path: Docho
    dependencies:
      - package: GRDB
      - package: Nuke
      - package: Nuke
        product: NukeUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.grillza.docho
        PRODUCT_NAME: Docho
        # The system libarchive, for RAR and 7-Zip comics (Vendor/CLibArchive).
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/CLibArchive
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: Docho/Resources/Info.plist
      properties:
        CFBundleDisplayName: Dōchō
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Kavita often runs on plain http on the LAN. NSAllowsLocalNetworking covers local IPs
        # and .local names; NSAllowsArbitraryLoads is also on because this is a personal,
        # sideloaded app and the server address is whatever the user types in.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Dōchō connects to your Kavita, Komga, BookOrbit or KOReader sync server on your local network.
        # "fetch" enables BGAppRefreshTask: opportunistic delivery of queued reading progress, and
        # automatic library updates (Settings → Library), which iOS runs when it decides.
        UIBackgroundModes:
          - fetch
        # The Local source: Documents shows in the Files app (On My iPhone › Dōchō), and comic
        # files can be opened in Dōchō from Files or shared to it.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.github.grillza.docho.cbz
            UTTypeDescription: Comic book archive
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [cbz]
              public.mime-type: [application/vnd.comicbook+zip]
          - UTTypeIdentifier: io.github.grillza.docho.cbr
            UTTypeDescription: Comic book archive (RAR)
            UTTypeConformsTo: [public.archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [cbr]
              public.mime-type: [application/vnd.comicbook-rar]
          - UTTypeIdentifier: io.github.grillza.docho.cb7
            UTTypeDescription: Comic book archive (7-Zip)
            UTTypeConformsTo: [public.archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [cb7]
          - UTTypeIdentifier: com.rarlab.rar-archive
            UTTypeDescription: RAR archive
            UTTypeConformsTo: [public.archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [rar]
              public.mime-type: [application/vnd.rar, application/x-rar-compressed]
          - UTTypeIdentifier: org.7-zip.7-zip-archive
            UTTypeDescription: 7-Zip archive
            UTTypeConformsTo: [public.archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [7z]
              public.mime-type: [application/x-7z-compressed]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Comic book archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [io.github.grillza.docho.cbz, io.github.grillza.docho.cbr, io.github.grillza.docho.cb7]
          - CFBundleTypeName: ZIP archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive]
          - CFBundleTypeName: RAR or 7-Zip archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.rarlab.rar-archive, org.7-zip.7-zip-archive]
          - CFBundleTypeName: EPUB book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
          - CFBundleTypeName: PDF document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        BGTaskSchedulerPermittedIdentifiers:
          - io.github.grillza.docho.progress-sync
          - io.github.grillza.docho.library-update
          # Downloads the user starts, shown by iOS 26 as a progress Live Activity (BGContinuedProcessingTask).
          - io.github.grillza.docho.downloads.*
    scheme:
      testTargets:
        - DochoTests
        - DochoUITests
      gatherCoverageData: false

  DochoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DochoTests
    dependencies:
      # GRDB and Nuke come in through the host app; linking them here too would duplicate them.
      - target: Docho
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.grillza.docho.tests
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/CLibArchive
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  DochoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DochoUITests
    dependencies:
      - target: Docho
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.grillza.docho.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: Docho
