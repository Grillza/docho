included:
  - Docho
  - DochoTests
  - DochoUITests

excluded:
  - Docho/Design/ColorSchemes.swift # generated by scripts/generate-themes.py

line_length:
  warning: 140
  ignores_comments: true

trailing_comma:
  mandatory_comma: true

identifier_name:
  excluded:
    - db # GRDB's conventional name for the database connection
    - id
    - m3 # the Material 3 colour scheme, as Compose's MaterialTheme.colorScheme
    - x
    - y
    - to
